    stage.querySelector("#display")

  <script id="301" type="module" hidden="">
    // Public, reactive mirrors of `line`/`iters`, built with Generators.observe
    // (the plain-JS alternative to OJS's `mutable`). These are *written to* by
    // `listener`, but never *read* by it — that one-way flow is what lets other
    // cells reactively display the current line/iteration count without ever
    // causing `listener` itself to be redefined (which would otherwise cause
    // cell 78 to re-attach the animationiteration event listener over and over).
    let setCurrentLine, setCurrentIters;
    const currentLine = Generators.observe((change) => {
      setCurrentLine = change;
      change(line.value);
    });
    const currentIters = Generators.observe((change) => {
      setCurrentIters = change;
      change(iters.value);
    });
  </script>
  <script id="206" type="module" hidden="">
    const listener = event => {
      let elem = 0;
      if (event.type == "animationiteration" && event.target.id == "display") {
        iters.value = (iters.value + 1) % 2;
        setCurrentIters(iters.value); // push to reactive mirror
        // console.log(
        //   event.elapsedTime + ": " + event.target.id + ": " + iters.value
        // );
        if (iters.value % 2 != 0) {
          // console.log("do something to: " + score[line.value]);
          for (let l = 0; l < word.length; l++) {
            elem = document.getElementById(l);
            if (!Array.from(elem.classList).includes("fadeInOut")) {
              elem.classList.add("fadeInOut");
            }
            if (score[line.value].includes(l)) {
              elem.classList.remove("fadeInOut");
            }
          }
          line.value = (line.value + 1) % score.length;
          setCurrentLine(line.value); // push to reactive mirror
        }
      }
    };
  </script>
